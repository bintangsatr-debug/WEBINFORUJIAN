["Sebuah sawah memakai sensor kelembapan tanah yang terhubung internet. Saat tanah kering, pompa irigasi menyala otomatis. Penerapan teknologi ini disebut ...",["Smart Agriculture","E-commerce","Cloud gaming","Social engineering","Digital forensik"],0,"IoT (Internet of Things) menghubungkan sensor dan alat melalui internet. Alurnya: sensor membaca data → sistem memutuskan → pompa bekerja. Jika IoT dipakai untuk memantau dan mengendalikan lahan secara otomatis, istilahnya Smart Agriculture (pertanian cerdas)."],
["Aplikasi agritech menghubungkan petani langsung ke konsumen akhir. Dampak ekonomi positif yang paling tepat adalah ...",["Harga pupuk otomatis turun","Rantai distribusi lebih pendek sehingga keuntungan petani naik","Petani tidak perlu menanam lagi","Semua tengkulak mendapat untung lebih besar","Hasil panen otomatis berlipat"],1,"Biasanya hasil panen melewati banyak perantara (tengkulak, agen, pedagang) dan tiap perantara mengambil untung. Platform agritech memotong rantai itu: petani menjual lebih tinggi, konsumen membeli lebih murah. Menganalisis dampak = melihat sebab → akibat ekonominya."],
["Dampak sosial negatif yang mungkin muncul dari drone dan mesin pemanen otomatis di pedesaan adalah ...",["Hasil panen menurun","Buruh tani kehilangan pekerjaan","Petani sulit mendapat informasi cuaca","Harga gabah pasti turun","Lahan menjadi sempit"],1,"Otomatisasi menggantikan tenaga manusia. Satu mesin pemanen dapat mengerjakan tugas banyak buruh, sehingga lapangan kerja buruh tani berkurang. Teknologi membawa manfaat sekaligus risiko sosial yang perlu diantisipasi (misalnya pelatihan keterampilan baru)."],

["Data cuaca dan riwayat serangan hama dianalisis dengan Big Data dan Machine Learning. Manfaat bagi petani adalah ...",["Petani tidak perlu lagi merawat tanaman","Petani dapat menentukan waktu tanam dan mencegah hama lebih awal","Cuaca dapat diubah sesuka hati","Hama hilang selamanya","Harga jual selalu naik"],1,"Big Data = kumpulan data besar. Machine Learning belajar pola dari data itu untuk membuat prediksi (kapan hujan, kapan hama datang). Prediksi membantu petani mengambil keputusan lebih dulu, bukan sekadar bereaksi."],
["Manfaat utama Rekam Medis Elektronik (RME) yang terintegrasi antar fasilitas kesehatan adalah ...",["Pasien tidak perlu diperiksa","Riwayat kesehatan pasien dapat diakses dokter di mana pun sehingga penanganan lebih cepat dan tepat","Biaya obat menjadi gratis","Dokter tidak perlu belajar lagi","Data tersimpan di kertas lebih aman"],1,"RME menyimpan riwayat penyakit, alergi, dan obat secara digital. Jika terintegrasi, pasien yang berpindah puskesmas atau rumah sakit tidak perlu mengulang pemeriksaan, dan dokter punya data lengkap untuk keputusan yang tepat."],
["Solusi sosial Telemedisin bagi masyarakat pelosok adalah ...",["Menutup puskesmas","Warga dapat berkonsultasi dengan dokter dari jauh tanpa menempuh perjalanan panjang","Semua penyakit sembuh sendiri","Dokter wajib pindah ke desa","Obat dikirim tanpa resep"],1,"Telemedisin = layanan kesehatan jarak jauh lewat video call atau chat. Di daerah yang jauh dari rumah sakit, ini mengurangi waktu, biaya, dan hambatan akses layanan sehingga layanan kesehatan lebih merata."],
["Data rekam medis ribuan pasien bocor dan dibaca pihak yang tidak berwenang. Aspek keamanan informasi yang terancam adalah ...",["Kerahasiaan (confidentiality)","Ketersediaan (availability)","Kecepatan","Kapasitas","Estetika"],0,"Tiga aspek keamanan informasi (CIA): Confidentiality (hanya yang berhak boleh membaca), Integrity (data tidak diubah sembarangan), Availability (data dapat diakses saat dibutuhkan). Data dibaca orang tak berwenang = kerahasiaan dilanggar."],

["Sistem AI diagnostik lebih akurat pada satu kelompok pasien dibanding kelompok lain. Penyebab utama Bias Algoritma ini adalah ...",["Layar monitor terlalu kecil","Data pelatihan tidak beragam atau tidak mewakili semua kelompok","Dokter terlalu banyak","Internet terlalu cepat","AI terlalu pintar"],1,"AI belajar dari data. Jika data latih didominasi satu kelompok (usia, jenis kelamin, suku), AI kurang mengenali pola kelompok lain. Prinsipnya: garbage in, bias out. Solusi: data yang beragam dan evaluasi berkala."],
["Tantangan etis dan hukum utama saat asisten AI merekomendasikan tindakan medis darurat adalah ...",["Warna aplikasi kurang menarik","Siapa yang bertanggung jawab jika rekomendasi AI keliru dan merugikan pasien","Ukuran file aplikasi","Jumlah pengguna yang sedikit","Harga ponsel"],1,"Dalam situasi darurat, kesalahan dapat membahayakan nyawa. Pertanyaan etis-hukumnya: apakah pengembang, rumah sakit, atau dokter yang bertanggung jawab? Karena itu diperlukan regulasi dan pengawasan manusia."],

["Aplikasi memindai penyakit daun padi memakai kamera smartphone. Cabang ilmu informatika yang berperan adalah ...",["Kecerdasan artifisial (computer vision)","Jaringan komputer","Sistem basis data","Keamanan siber","Rekayasa perangkat keras"],0,"Computer vision adalah bagian dari kecerdasan artifisial yang membuat komputer 'melihat' dan mengenali objek dari gambar. Aplikasi ini mengenali pola bercak pada daun lalu menyimpulkan jenis penyakitnya."],
["IoT pertanian dan telemedisin di pedesaan paling sesuai dengan pilar SDGs ...",["SDG 2 (Tanpa Kelaparan) dan SDG 3 (Kehidupan Sehat dan Sejahtera)","SDG 7 dan SDG 14","SDG 4 dan SDG 5","SDG 13 dan SDG 16","SDG 11 dan SDG 12"],0,"IoT pertanian meningkatkan produksi pangan (SDG 2). Telemedisin memperluas layanan kesehatan (SDG 3). Cocokkan manfaat teknologi dengan tujuan SDGs-nya."],
